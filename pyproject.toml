[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-projection"
version = "0.1.0"
description = "Project a 3D NRRD volume onto arbitrary planes"
requires-python = ">=3.10"
dependencies = ["numpy", "pynrrd", "imageio", "imageio-ffmpeg"]

[project.optional-dependencies]
fast = ["numba"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running performance tests"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["SIM300"]

[tool.mypy]
files = ["src"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["nrrd", "imageio", "imageio.*"]
ignore_missing_imports = true
