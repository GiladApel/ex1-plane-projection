name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numba: [with-numba, without-numba]
        include:
          - {os: windows-latest, python-version: "3.12", numba: with-numba}
          - {os: windows-latest, python-version: "3.14", numba: with-numba}
          - {os: windows-latest, python-version: "3.14", numba: without-numba}
          - {os: macos-latest, python-version: "3.12", numba: with-numba}
          - {os: macos-latest, python-version: "3.14", numba: with-numba}
          - {os: macos-latest, python-version: "3.14", numba: without-numba}
    name: ${{ matrix.os }} py${{ matrix.python-version }} ${{ matrix.numba }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install with Numba
        if: matrix.numba == 'with-numba'
        run: pip install -e ".[dev,fast]"
      - name: Install without Numba
        if: matrix.numba == 'without-numba'
        run: pip install -e ".[dev]"
      - name: Check Numba availability
        run: python -c "import importlib.util as u; print('numba installed:', u.find_spec('numba') is not None)"
      - name: Run tests
        run: pytest -q --cov=projection --cov-report=term

  lint:
    runs-on: ubuntu-latest
    name: ruff and mypy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,fast]"
      - run: ruff check .
      - run: mypy

  speed:
    runs-on: ubuntu-latest
    name: speed ratios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,fast]"
      - name: Machine-independent speed tests (thread scaling, Numba vs NumPy)
        run: pytest -m portable -q
